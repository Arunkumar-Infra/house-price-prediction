trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  PYTHON_VERSION: '3.12'
  SONAR_SERVICE_CONNECTION: 'SonarQube'
  SONAR_ORGANIZATION_NAME: 'Arunkumar J'
  SONAR_ORGANIZATION_KEY: 'arunkumar-infra'
  SONAR_PROJECT_KEY: 'house-price-prediction'
  SONAR_PROJECT_NAME: 'House Price Prediction'
  SONAR_PROJECT_VERSION: '1.0'

steps:
- checkout: self
  displayName: 'Checkout source code'

- task: UsePythonVersion@0
  displayName: 'Use Python $(PYTHON_VERSION)'
  inputs:
    versionSpec: '$(PYTHON_VERSION)'
    addToPath: true

- script: |
    python -m pip install --upgrade pip
    pip install -r requirement.txt
    pip install pytest pytest-cov pytest-html
  displayName: 'Install project dependencies'

- script: |
    mkdir -p test-results
    pytest test_app_50_cases.py \
      -v \
      --junitxml=test-results/junit.xml \
      --html=test-results/unit-test-report.html \
      --self-contained-html
  displayName: 'Run unit tests'
  continueOnError: true

- task: PublishTestResults@2
  condition: always()
  displayName: 'Publish unit test results'
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: 'test-results/junit.xml'
    testRunTitle: 'House Price Prediction Unit Tests'
    failTaskOnFailedTests: false

- script: |
    pytest test_app_50_cases.py --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing
  displayName: 'Generate coverage report'
  continueOnError: true

- task: PublishPipelineArtifact@1
  condition: always()
  displayName: 'Publish test report artifacts'
  inputs:
    targetPath: 'test-results'
    artifact: 'unit-test-report'
    publishLocation: 'pipeline'

- task: SonarCloudPrepare@1
  displayName: 'Prepare SonarCloud analysis'
  inputs:
    SonarCloud: '$(SONAR_SERVICE_CONNECTION)'
    organization: '$(SONAR_ORGANIZATION_KEY)'
    scannerMode: 'CLI'
    configMode: 'manual'
    cliProjectKey: '$(SONAR_PROJECT_KEY)'
    cliProjectName: '$(SONAR_PROJECT_NAME)'
    cliProjectVersion: '$(SONAR_PROJECT_VERSION)'
    extraProperties: |
      sonar.organization=$(SONAR_ORGANIZATION_KEY)
      sonar.language=py
      sonar.sources=.
      sonar.tests=.
      sonar.test.inclusions=**/test*.py
      sonar.exclusions=**/venv/**,**/.venv/**,**/templates/**,**/static/**,**/node_modules/**,**/*.html
      sonar.python.version=3.12
      sonar.python.coverage.reportPaths=coverage.xml
      sonar.python.xunit.reportPath=test-results/junit.xml

- task: SonarCloudAnalyze@1
  displayName: 'Run SonarCloud analysis'

- task: SonarCloudPublish@1
  displayName: 'Publish SonarCloud results'